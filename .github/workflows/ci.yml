name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start server & verify
        run: |
          npm start &
          sleep 3
          # `version` proves the process booted THIS commit, not merely that
          # something is listening. GET / carried no version until 2026-11-24,
          # which is how this repo came to document deploys that never happened.
          curl -sf http://localhost:3001 > /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"version"' /tmp/health.json
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PORT: 3001
